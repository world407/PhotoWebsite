name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同分支新推送时取消旧的运行，节省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Lint + TypeCheck + Build + UnitTest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint（零警告门禁）
        run: npm run lint

      - name: TypeScript 类型检查 + 构建
        run: npm run build

      - name: Vitest 单元测试
        run: npm run test:run
