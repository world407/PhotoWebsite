name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同分支新推送时取消旧的运行，节省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Lint + TypeCheck + Build + UnitTest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint（零警告门禁）
        run: npm run lint

      - name: TypeScript 类型检查 + 构建
        run: npm run build

      - name: Vitest 单元测试
        run: npm run test:run

  e2e:
    name: Playwright E2E (chromium)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: 安装 Playwright Chromium 与系统依赖
        run: npx playwright install --with-deps chromium

      - name: 运行 E2E
        run: npx playwright test

      - name: 上传失败产物（trace / 截图 / 报告）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  deploy-pages:
    name: Deploy SSG to GitHub Pages
    # 仅 main 分支推送时部署；门禁双 Job 全绿才执行
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality-gate, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      # 允许 configure-pages 首次自动启用 Pages
      administration: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: SSG 预渲染构建（GitHub Pages 子路径 base）
        run: npm run build:ssg
        env:
          BASE_PATH: /PhotoWebsite/

      - name: SPA fallback（未预渲染路径交给客户端路由渲染 404）
        run: cp dist/index.html dist/404.html

      - name: 禁用 Jekyll 处理（保留下划线开头目录）
        run: touch dist/.nojekyll

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 上传部署产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
